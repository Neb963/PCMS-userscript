name: synthetic checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify repository and references
        run: npm run check:bootstrap
      - name: Build production userscript
        run: npm run build
      - name: JavaScript syntax
        run: npm run check:syntax
      - name: Synthetic contracts
        run: npm test
