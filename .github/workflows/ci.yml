name: synthetic checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify repository and references
        run: npm run check:bootstrap
      - name: Build production userscript
        run: npm run build
      - name: JavaScript syntax
        run: npm run check:syntax
      - name: Synthetic contracts
        run: npm test

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - name: Chromium synthetic UI
        run: npm run test:ui
      - name: Firefox synthetic UI
        run: npm run test:ui
        env:
          PCMS_UI_BROWSER: firefox
