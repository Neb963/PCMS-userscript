name: synthetic UI
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/**'
      - 'src/entry.user.js'
      - 'src/state/store.js'
      - 'tests/ui/**'
      - 'scripts/build.mjs'
      - 'package*.json'
      - '.github/workflows/ui.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/ui/**'
      - 'scripts/build.mjs'
      - 'package*.json'
      - '.github/workflows/ui.yml'
permissions:
  contents: read
jobs:

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - name: Chromium synthetic UI
        run: npm run test:ui
      - name: Firefox synthetic UI
        run: npm run test:ui
        env:
          PCMS_UI_BROWSER: firefox
