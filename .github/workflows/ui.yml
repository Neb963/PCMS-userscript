name: synthetic UI
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/**'
      - 'src/entry.user.js'
      - 'src/state/store.js'
      - 'src/runtime/build-mode.js'
      - 'src/runtime/context.js'
      - 'src/adapters/perchance/session.js'
      - 'tests/ui/**'
      - 'scripts/build.mjs'
      - 'package*.json'
      - '.github/workflows/ui.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/ui/**'
      - 'scripts/build.mjs'
      - 'package*.json'
      - '.github/workflows/ui.yml'
permissions:
  contents: read
jobs:

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox
      - run: |
          npm run build
          npm run build:operator-test
          npm run check:candidate
          npm run check:operator-test
      - name: Chromium synthetic UI
        run: |
          npm run test:ui
          PCMS_UI_PROFILE=operator-test npm run test:ui
      - name: Firefox synthetic UI
        if: always()
        run: |
          npm run test:ui
          PCMS_UI_PROFILE=operator-test npm run test:ui
        env:
          PCMS_UI_BROWSER: firefox
      - name: Chromium enabled-test visual scenario audit
        if: always()
        run: node tests/ui/visual-audit.mjs
        env:
          PCMS_AUDIT_STRICT: 1
          PCMS_UI_PROFILE: operator-test
      - name: Firefox enabled-test visual scenario audit
        if: always()
        run: node tests/ui/visual-audit.mjs
        env:
          PCMS_UI_BROWSER: firefox
          PCMS_AUDIT_STRICT: 1
          PCMS_UI_PROFILE: operator-test
      - name: Visual audit screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: synthetic-visual-audit
          path: test-results/visual-audit
          retention-days: 7
